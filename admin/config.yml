backend:
  name: git-gateway
  repo: Boxiaoli-Lab/zm-team
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "collaborations"
    label: "科研合作项目"
    folder: "content/collaborations"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "课题名称", name: "title", widget: "string"}
      - label: "合作教师成员"
        name: "members"
        widget: "select"
        multiple: true
        options:
          - "陈玉伟"
          - "段咏欣"
          - "蒋敏"
          - "李柏霄"
          - "李明杰"
          - "刘云霄"
          - "孙依晗"
          - "王纲"
          - "王杰"
          - "王淑雪"
          - "乌皓"
          - "杨洪生"
          - "袁媛"
          - "张建明"
          - "张晓芳"
          - "张泽军"
          - "周立娟"
          - "周丽娟"
          - "宗鲁"
      - label: "合作状态"
        name: "status"
        widget: "select"
        options: ["在研中", "已结题"]
        default: "在研中"
      - {label: "对接执行学生", name: "student", widget: "string", required: false}
      - {label: "开始日期", name: "startDate", widget: "string", required: false, placeholder: "例如: 2026-03-01"}
      - {label: "结束日期", name: "endDate", widget: "string", required: false, placeholder: "例如: 2026-09-01"}
      - {label: "合作分工与贡献", name: "contribution", widget: "text", required: false}
      - {label: "合作预期/实际成果", name: "result", widget: "text", required: false}
