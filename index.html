<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZM 团队科研合作管理系统</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    .teacher-card {
      transition: all 0.25s ease-in-out;
    }
    .teacher-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-700 p-2.5 rounded-lg">
          <i class="fa-solid fa-flask-vial text-2xl text-indigo-200"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">ZM 团队科研合作管理系统</h1>
          <p class="text-xs text-indigo-300">Research Collaboration Network & Faculty Directory</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="fetchData()" class="px-3 py-1.5 bg-indigo-800 hover:bg-indigo-700 text-indigo-200 text-xs font-medium rounded-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate"></i> 刷新数据
        </button>
        <a href="./admin/" class="px-3.5 py-1.5 bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-semibold rounded-md shadow-sm transition flex items-center gap-1.5">
          <i class="fa-solid fa-sliders"></i> 管理后台 (Decap CMS)
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    
    <!-- Top Search & Stats Bar -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200/80 p-5 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="filterTeachers()" placeholder="搜索教师姓名、拼音首字母、研究方向..." 
               class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
      </div>
      
      <div class="flex items-center space-x-6 text-sm text-slate-600">
        <div><span class="font-bold text-indigo-600 text-base" id="totalTeachers">19</span> 位合作教师</div>
        <div class="h-4 w-px bg-slate-200"></div>
        <div>已结题合作：<span class="font-semibold text-emerald-600" id="totalCompleted">0</span> 项</div>
        <div class="h-4 w-px bg-slate-200"></div>
        <div>在研合作：<span class="font-semibold text-amber-600" id="totalOngoing">0</span> 项</div>
      </div>
    </div>

    <!-- Teacher Grid Container -->
    <div id="teacherGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- 动态插入教师卡片 -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-100 border-t border-slate-200 mt-12 py-4">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 flex justify-between items-center">
      <p>© 2026 ZM Research Team. All rights reserved.</p>
      <p>数据实时同步自 Git 仓库</p>
    </div>
  </footer>

  <!-- App Script -->
  <script>
    // 19位教师初始名录（按照字母顺序排序，带拼音缩写及标识）
    const initialTeachers = [
      { id: "cai-lh", name: "蔡利华", initials: "CLH", pinyin: "Cai Lihua" },
      { id: "chen-xf", name: "陈晓峰", initials: "CXF", pinyin: "Chen Xiaofeng" },
      { id: "du-jb", name: "杜建波", initials: "DJB", pinyin: "Du Jianbo" },
      { id: "feng-yj", name: "冯亚青", initials: "FYQ", pinyin: "Feng Yaqing" },
      { id: "guo-hb", name: "郭海波", initials: "GHB", pinyin: "Guo Haibo" },
      { id: "huang-mr", name: "黄明荣", initials: "HMR", pinyin: "Huang Mingrong" },
      { id: "li-bx", name: "李柏霄", initials: "LBX", pinyin: "Li Baixiao" },
      { id: "li-qm", name: "李启明", initials: "LQM", pinyin: "Li Qiming" },
      { id: "liu-zh", name: "刘志华", initials: "LZH", pinyin: "Liu Zhihua" },
      { id: "lu-yl", name: "卢咏来", initials: "LYL", pinyin: "Lu Yonglai" },
      { id: "ma-yj", name: "马亚君", initials: "MYJ", pinyin: "Ma Yajun" },
      { id: "sun-tl", name: "孙铁龙", initials: "STL", pinyin: "Sun Tielong" },
      { id: "wang-yh", name: "王宇航", initials: "WYH", pinyin: "Wang Yuhang" },
      { id: "wu-zm", name: "吴文明", initials: "WWM", pinyin: "Wu Wenming" },
      { id: "xu-lh", name: "徐丽华", initials: "XLH", pinyin: "Xu Lihua" },
      { id: "yang-hf", name: "杨海峰", initials: "YHF", pinyin: "Yang Haifeng" },
      { id: "zhang-jm", name: "张建明", initials: "ZJM", pinyin: "Zhang Jianming" },
      { id: "zhao-xr", name: "赵向荣", initials: "ZXR", pinyin: "Zhao Xiangrong" },
      { id: "zhou-lh", name: "周立华", initials: "ZLH", pinyin: "Zhou Lihua" }
    ];

    let collaborationsData = [];

    async function fetchData() {
      try {
        const response = await fetch(`./data/collaborations.json?v=${Date.now()}`);
        if (response.ok) {
          const json = await response.json();
          collaborationsData = json.items || [];
          localStorage.setItem('zm_collaborations_backup', JSON.stringify(collaborationsData));
        } else {
          throw new Error("Cloud fetch failed");
        }
      } catch (e) {
        console.warn("Using local cache fallback");
        const cache = localStorage.getItem('zm_collaborations_backup');
        if (cache) collaborationsData = JSON.parse(cache);
      }
      renderGrid();
    }

    function renderGrid() {
      const searchKey = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('teacherGrid');
      grid.innerHTML = '';

      let grandCompleted = 0;
      let grandOngoing = 0;

      // 按照字母顺序对教师排序
      const sortedTeachers = [...initialTeachers].sort((a, b) => a.initials.localeCompare(b.initials));

      sortedTeachers.forEach(teacher => {
        // 匹配该教师的合作记录
        const teacherCollabs = collaborationsData.filter(item => 
          item.members && item.members.includes(teacher.name)
        );

        // 计算正在进行/已完成数量
        let completedCount = 0;
        let ongoingCount = 0;

        teacherCollabs.forEach(collab => {
          if (collab.status === "已结题" || collab.endDate < "2026-01-01") {
            completedCount++;
          } else {
            ongoingCount++;
          }
        });

        grandCompleted += completedCount;
        grandOngoing += ongoingCount;

        const totalCollabs = teacherCollabs.length;
        
        // 热度计算（合作项目越多热度图标越火热）
        let heatBadge = '<span class="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded"><i class="fa-solid fa-temperature-empty text-slate-400"></i> 常规</span>';
        if (totalCollabs >= 3) {
          heatBadge = '<span class="text-xs font-semibold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-100"><i class="fa-solid fa-fire text-rose-500"></i> 极高热度</span>';
        } else if (totalCollabs >= 1) {
          heatBadge = '<span class="text-xs font-medium text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-100"><i class="fa-solid fa-fire-flame-curved text-amber-500"></i> 活跃</span>';
        }

        // 搜索过滤
        const matchSearch = teacher.name.includes(searchKey) || 
                            teacher.initials.toLowerCase().includes(searchKey) || 
                            teacher.pinyin.toLowerCase().includes(searchKey);

        if (!matchSearch) return;

        // 构建卡片 HTML
        const cardHTML = `
          <div class="teacher-card bg-white rounded-xl border border-slate-200/90 p-5 flex flex-col justify-between shadow-sm relative overflow-hidden">
            <div class="flex items-start justify-between mb-4">
              <div class="flex items-center space-x-3">
                <div class="w-11 h-11 bg-indigo-100 text-indigo-700 font-bold text-sm rounded-full flex items-center justify-center tracking-wider border border-indigo-200">
                  ${teacher.initials}
                </div>
                <div>
                  <h3 class="font-bold text-slate-800 text-base flex items-center gap-1.5">
                    ${teacher.name}
                  </h3>
                  <p class="text-xs text-slate-400">${teacher.pinyin}</p>
                </div>
              </div>
              <div>${heatBadge}</div>
            </div>

            <div class="grid grid-cols-2 gap-2 my-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100 text-center">
              <div class="border-r border-slate-200 pr-1">
                <div class="text-xs text-slate-500 mb-0.5">已完成合作</div>
                <div class="text-lg font-bold text-emerald-600">${completedCount}</div>
              </div>
              <div class="pl-1">
                <div class="text-xs text-slate-500 mb-0.5">进行中合作</div>
                <div class="text-lg font-bold text-amber-600">${ongoingCount}</div>
              </div>
            </div>

            <div class="mt-2 pt-3 border-t border-slate-100 flex justify-between items-center">
              <span class="text-xs text-slate-500">参与合作课题: <strong class="text-slate-700">${totalCollabs}</strong> 项</span>
            </div>
          </div>
        `;
        grid.innerHTML += cardHTML;
      });

      document.getElementById('totalTeachers').innerText = sortedTeachers.length;
      document.getElementById('totalCompleted').innerText = grandCompleted;
      document.getElementById('totalOngoing').innerText = grandOngoing;
    }

    function filterTeachers() {
      renderGrid();
    }

    window.addEventListener('DOMContentLoaded', fetchData);
  </script>
</body>
</html>
