<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZM 团队 - 科研合作管理系统</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 内置 SVG 图标组件
    const Icons = {
      Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      BookOpen: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>,
      Calendar: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
      GraduationCap: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"/></svg>,
      Settings: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      ExternalLink: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>,
      Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
      Sparkles: () => <svg className="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
    };

    function App() {
      const [collaborations, setCollaborations] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedMember, setSelectedMember] = useState('ALL');
      const [dataSource, setDataSource] = useState('');

      // 加载数据逻辑：优先 fetch JSON 文件，失败则降级使用 localStorage
      const fetchData = () => {
        setLoading(true);
        fetch('./data/collaborations.json?v=' + Date.now())
          .then(res => {
            if (!res.ok) throw new Error('Network response was not ok');
            return res.json();
          })
          .then(data => {
            if (data && Array.isArray(data.items)) {
              setCollaborations(data.items);
              setDataSource('云端文件 (data/collaborations.json)');
            } else if (Array.isArray(data)) {
              setCollaborations(data);
              setDataSource('云端文件 (data/collaborations.json)');
            } else {
              throw new Error('Invalid format');
            }
          })
          .catch(err => {
            console.log('读取 JSON 文件失败或文件不存在，回退至本地存储:', err);
            const saved = localStorage.getItem('zm_collaborations');
            if (saved) {
              try {
                setCollaborations(JSON.parse(saved));
                setDataSource('本地存储 (localStorage)');
              } catch (e) {
                setCollaborations(getInitialData());
                setDataSource('默认示例数据');
              }
            } else {
              setCollaborations(getInitialData());
              setDataSource('默认示例数据');
            }
          })
          .finally(() => {
            setLoading(false);
          });
      };

      useEffect(() => {
        fetchData();
      }, []);

      // 默认示例数据
      function getInitialData() {
        return [
          {
            members: ["张建明", "李柏霄"],
            topic: "自修复聚氨酯分子设计与结构表征",
            student: "张三",
            startDate: "2026-01-01",
            endDate: "2026-12-31",
            labor: "张建明团队负责材料分子合成与力学测试；李柏霄团队负责核磁及微观表征分析。",
            outputs: "预估发表 JACS / Angew 高水平研究论文 1 篇，申报发明专利 1 项"
          }
        ];
      }

      // 获取所有独立参与老师列表
      const allMembers = useMemo(() => {
        const set = new Set();
        collaborations.forEach(item => {
          if (Array.isArray(item.members)) {
            item.members.forEach(m => set.add(m));
          }
        });
        return Array.from(set);
      }, [collaborations]);

      // 筛选过滤
      const filteredItems = useMemo(() => {
        return collaborations.filter(item => {
          const matchesSearch = 
            (item.topic || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.student || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.labor || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.outputs || '').toLowerCase().includes(searchTerm.toLowerCase());
          
          const matchesMember = selectedMember === 'ALL' || 
            (Array.isArray(item.members) && item.members.includes(selectedMember));

          return matchesSearch && matchesMember;
        });
      }, [collaborations, searchTerm, selectedMember]);

      // 统计数据
      const stats = useMemo(() => {
        const totalProjects = collaborations.length;
        const totalMembers = allMembers.length;
        const students = new Set(collaborations.map(c => c.student).filter(Boolean)).size;
        return { totalProjects, totalMembers, students };
      }, [collaborations, allMembers]);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* 顶栏 Header */}
            <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div className="flex items-center space-x-3">
                  <div className="bg-indigo-600 p-2.5 rounded-xl text-white shadow-md">
                    <Icons.BookOpen />
                  </div>
                  <div>
                    <h1 className="text-xl font-bold tracking-tight">ZM 团队科研合作管理系统</h1>
                    <p className="text-xs text-slate-400">Research Collaboration & Outcomes Platform</p>
                  </div>
                </div>

                <div className="flex items-center space-x-3">
                  <button 
                    onClick={fetchData}
                    className="flex items-center space-x-1 px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition"
                    title="刷新最新云端数据"
                  >
                    <Icons.Refresh />
                    <span>刷新</span>
                  </button>
                  <a
                    href="./admin/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm hover:shadow"
                  >
                    <Icons.Settings />
                    <span>管理后台 (Decap CMS)</span>
                    <Icons.ExternalLink />
                  </a>
                </div>
              </div>
            </header>

            {/* 主要内容区域 */}
            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
              
              {/* 统计看板 */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div className="glass-card p-6 rounded-2xl shadow-sm border border-slate-200/80 flex items-center space-x-4">
                  <div className="p-3.5 bg-indigo-50 text-indigo-600 rounded-xl">
                    <Icons.BookOpen />
                  </div>
                  <div>
                    <div className="text-2xl font-bold text-slate-900">{stats.totalProjects}</div>
                    <div className="text-xs font-medium text-slate-500">开展合作课题总数</div>
                  </div>
                </div>

                <div className="glass-card p-6 rounded-2xl shadow-sm border border-slate-200/80 flex items-center space-x-4">
                  <div className="p-3.5 bg-emerald-50 text-emerald-600 rounded-xl">
                    <Icons.Users />
                  </div>
                  <div>
                    <div className="text-2xl font-bold text-slate-900">{stats.totalMembers}</div>
                    <div className="text-xs font-medium text-slate-500">参与合作教师人数</div>
                  </div>
                </div>

                <div className="glass-card p-6 rounded-2xl shadow-sm border border-slate-200/80 flex items-center space-x-4">
                  <div className="p-3.5 bg-amber-50 text-amber-600 rounded-xl">
                    <Icons.Sparkles />
                  </div>
                  <div>
                    <div className="text-2xl font-bold text-slate-900">{stats.students}</div>
                    <div className="text-xs font-medium text-slate-500">对接执行学生总数</div>
                  </div>
                </div>
              </div>

              {/* 搜索与筛选工具栏 */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col md:flex-row items-center justify-between gap-4">
                {/* 搜索框 */}
                <div className="relative w-full md:w-96">
                  <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <Icons.Search />
                  </div>
                  <input
                    type="text"
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                    placeholder="搜索课题名称、学生姓名、贡献或成果..."
                    className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                  />
                </div>

                {/* 教师标签筛选 */}
                <div className="flex items-center space-x-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                  <span className="text-xs font-medium text-slate-500 whitespace-nowrap">筛选教师:</span>
                  <button
                    onClick={() => setSelectedMember('ALL')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition ${
                      selectedMember === 'ALL'
                        ? 'bg-slate-900 text-white shadow-sm'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    全部 ({collaborations.length})
                  </button>
                  {allMembers.map(member => (
                    <button
                      key={member}
                      onClick={() => setSelectedMember(member)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition ${
                        selectedMember === member
                          ? 'bg-indigo-600 text-white shadow-sm'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      }`}
                    >
                      {member}
                    </button>
                  ))}
                </div>
              </div>

              {/* 合作卡片列表 */}
              {loading ? (
                <div className="text-center py-16 bg-white rounded-2xl border border-slate-200/80">
                  <div className="inline-block animate-spin text-indigo-600 mb-3">
                    <Icons.Refresh />
                  </div>
                  <p className="text-sm text-slate-500">正在加载最新科研合作记录...</p>
                </div>
              ) : filteredItems.length === 0 ? (
                <div className="text-center py-16 bg-white rounded-2xl border border-slate-200/80">
                  <p className="text-slate-500 text-sm">未找到符合条件的合作记录</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 gap-6">
                  {filteredItems.map((item, idx) => (
                    <div 
                      key={idx}
                      className="bg-white rounded-2xl p-6 shadow-sm hover:shadow-md border border-slate-200/80 transition duration-200 space-y-4"
                    >
                      {/* 头部：题目与成员 */}
                      <div className="flex flex-col md:flex-row md:items-start justify-between gap-3 border-b border-slate-100 pb-4">
                        <div className="space-y-2">
                          <h3 className="text-lg font-bold text-slate-900 leading-snug">
                            {item.topic}
                          </h3>
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="text-xs text-slate-400 font-medium">合作成员:</span>
                            {Array.isArray(item.members) && item.members.map((m, i) => (
                              <span 
                                key={i}
                                className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100"
                              >
                                {m}
                              </span>
                            ))}
                          </div>
                        </div>

                        {/* 学生与周期 */}
                        <div className="flex flex-wrap md:flex-col items-start md:items-end gap-2 text-xs text-slate-500">
                          {item.student && (
                            <div className="flex items-center space-x-1.5 bg-slate-100 px-2.5 py-1 rounded-md text-slate-700 font-medium">
                              <Icons.GraduationCap />
                              <span>执行学生: {item.student}</span>
                            </div>
                          )}
                          <div className="flex items-center space-x-1 text-slate-400">
                            <Icons.Calendar />
                            <span>{item.startDate || '未定'} ~ {item.endDate || '未定'}</span>
                          </div>
                        </div>
                      </div>

                      {/* 内容分工与成果 */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm pt-1">
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-1">
                          <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">合作分工与贡献</div>
                          <p className="text-slate-700 leading-relaxed whitespace-pre-line">
                            {item.labor || '暂未填写详细分工说明'}
                          </p>
                        </div>

                        <div className="bg-amber-50/60 p-4 rounded-xl border border-amber-100/80 space-y-1">
                          <div className="text-xs font-bold text-amber-700 uppercase tracking-wider flex items-center space-x-1">
                            <span>合作预期/实际成果</span>
                          </div>
                          <p className="text-slate-800 font-medium leading-relaxed whitespace-pre-line">
                            {item.outputs || '暂未填写预期成果'}
                          </p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>

          {/* 页脚 */}
          <footer className="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
              <div>© 2026 ZM Research Team. All rights reserved.</div>
              <div className="flex items-center space-x-2">
                <span>数据来源: <strong className="text-slate-700">{dataSource}</strong></span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
